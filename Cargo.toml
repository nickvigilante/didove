[package]
name = "didove"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Where did this command come from? A `which` that shows every match, the symlink chain and the package it came from."
license = "MIT"
repository = "https://github.com/nickvigilante/didove"
readme = "README.md"
keywords = ["which", "path", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "didove"
path = "src/lib.rs"

[[bin]]
name = "dv"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive", "env"] }
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.49.0", features = ["filters"] }
tempfile = "3.27.0"
